name: Android CI

on:
  # A push csak a main-en fut: PR-ágon a pull_request trigger fedi le a commitokat,
  # így nem indul minden commitra két azonos futás.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Egy ágon/PR-en egyszerre csak egy futás legyen: a gyors egymás utáni pusholásnál
# a régebbi futás megszakad. A main-en nem szakítunk meg semmit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A google-services.json nincs a repóban, ezért a build Firebase
      # konfiguráció nélkül fut – a fordítást és a teszteket ez nem érinti.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
